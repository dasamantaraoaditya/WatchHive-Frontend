<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/src/watchhive/assets/images/watchhive-logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1" />
  <meta name="description" content="WatchersHive — Track every movie, anime, K-drama, and TV series you watch. Rate, review, and discover with a community of fellow watchers." />
  <meta name="theme-color" content="#ffb700" />
  <title>WatchersHive — Track Movies, Anime, K-Drama & Series</title>
  <link rel="manifest" href="/manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="referrer" content="no-referrer-when-downgrade" />

  <meta name="apple-mobile-web-app-title" content="WatchersHive" />
  <meta name="apple-itunes-app" content="app-id=6748434771, app-argument=https://watchershive.com/" />
  <link rel="apple-touch-icon" href="/icons/icon-192x192.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <script id="tailwind-config">
        tailwind.config = {
            theme: {

                extend: {
                    colors: {
                        "primary": "#ffb700",
                        "background-light": "#FFF9F0",
                        "background-dark": "#1a160d",
                        "card-light": "#FFFFFF",
                        "charcoal": "#2D2926",
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        display: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
  </script>
</head>

<body>
  <div id="root">
    <div style="min-height: 100dvh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #FFF9F0; font-family: 'Inter', system-ui, -apple-system, sans-serif;">
      <div style="width: 84px; height: 84px; background: #ffffff; border-radius: 26px; box-shadow: 0 12px 30px rgba(255, 183, 0, 0.25); border: 1.5px solid rgba(255, 183, 0, 0.3); display: flex; align-items: center; justify-content: center; padding: 14px; animation: whInitialPulse 1.6s ease-in-out infinite;">
        <img src="/icons/icon-192x192.png" alt="WatchersHive" style="width: 100%; height: 100%; object-fit: contain;" />
      </div>
      <div style="margin-top: 20px; font-weight: 900; font-size: 17px; color: #2D2926; letter-spacing: -0.3px;">
        Watchers<span style="color: #ffb700;">Hive</span>
      </div>
      <div style="margin-top: 6px; font-weight: 600; font-size: 12px; color: rgba(45, 41, 38, 0.45); letter-spacing: 0.2px;">
        Loading your hive...
      </div>
      <style>
        @keyframes whInitialPulse {
          0%, 100% { transform: scale(1) translateY(0); filter: drop-shadow(0 4px 10px rgba(255, 183, 0, 0.2)); }
          50% { transform: scale(1.05) translateY(-4px); filter: drop-shadow(0 12px 24px rgba(255, 183, 0, 0.4)); }
        }
      </style>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
