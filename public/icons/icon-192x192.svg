<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9500;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="192" height="192" fill="url(#grad1)" rx="45"/>
  
  <!-- Movie film reel -->
  <circle cx="96" cy="96" r="55" fill="white" opacity="0.2"/>
  <circle cx="96" cy="96" r="50" fill="none" stroke="white" stroke-width="4" opacity="0.4"/>
  
  <!-- Film strip -->
  <rect x="60" y="75" width="12" height="12" fill="white" opacity="0.8"/>
  <rect x="75" y="75" width="12" height="12" fill="white" opacity="0.8"/>
  <rect x="105" y="75" width="12" height="12" fill="white" opacity="0.8"/>
  <rect x="120" y="75" width="12" height="12" fill="white" opacity="0.8"/>
  
  <!-- Bee body -->
  <ellipse cx="96" cy="105" rx="18" ry="22" fill="black"/>
  <!-- Bee stripes -->
  <ellipse cx="96" cy="92" rx="18" ry="6" fill="#ffb700"/>
  <ellipse cx="96" cy="110" rx="18" ry="6" fill="#ffb700"/>
  <!-- Bee wings -->
  <ellipse cx="75" cy="100" rx="12" ry="20" fill="white" opacity="0.7"/>
  <ellipse cx="117" cy="100" rx="12" ry="20" fill="white" opacity="0.7"/>
  <!-- Bee head -->
  <circle cx="96" cy="85" r="8" fill="black"/>
  <!-- Bee eyes -->
  <circle cx="91" cy="83" r="2" fill="white"/>
  <circle cx="101" cy="83" r="2" fill="white"/>
  <!-- Antenna -->
  <path d="M 96 77 Q 88 70 85 65" stroke="black" stroke-width="1.5" fill="none"/>
  <path d="M 96 77 Q 104 70 107 65" stroke="black" stroke-width="1.5" fill="none"/>
</svg>
