<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffb700;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ff9500;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#grad2)" rx="120"/>
  
  <!-- Movie film reel -->
  <circle cx="256" cy="256" r="140" fill="white" opacity="0.2"/>
  <circle cx="256" cy="256" r="130" fill="none" stroke="white" stroke-width="10" opacity="0.4"/>
  
  <!-- Film strip -->
  <rect x="180" y="200" width="32" height="32" fill="white" opacity="0.8"/>
  <rect x="230" y="200" width="32" height="32" fill="white" opacity="0.8"/>
  <rect x="280" y="200" width="32" height="32" fill="white" opacity="0.8"/>
  <rect x="300" y="200" width="32" height="32" fill="white" opacity="0.8"/>
  
  <!-- Bee body -->
  <ellipse cx="256" cy="300" rx="48" ry="58" fill="black"/>
  <!-- Bee stripes -->
  <ellipse cx="256" cy="270" rx="48" ry="16" fill="#ffb700"/>
  <ellipse cx="256" cy="310" rx="48" ry="16" fill="#ffb700"/>
  <!-- Bee wings -->
  <ellipse cx="190" cy="290" rx="32" ry="52" fill="white" opacity="0.7"/>
  <ellipse cx="322" cy="290" rx="32" ry="52" fill="white" opacity="0.7"/>
  <!-- Bee head -->
  <circle cx="256" cy="220" r="22" fill="black"/>
  <!-- Bee eyes -->
  <circle cx="242" cy="212" r="6" fill="white"/>
  <circle cx="270" cy="212" r="6" fill="white"/>
  <!-- Antenna -->
  <path d="M 256 198 Q 230 160 220 140" stroke="black" stroke-width="4" fill="none"/>
  <path d="M 256 198 Q 282 160 292 140" stroke="black" stroke-width="4" fill="none"/>
</svg>
